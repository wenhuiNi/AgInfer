[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aginfer"
version = "0.1.0"
description = "Experimental foundations for target-specific VLA/VLM AOT deployment"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []

[project.optional-dependencies]
hub = ["huggingface-hub>=0.24"]
dev = ["pytest>=8"]

[project.scripts]
aginfer = "aginfer.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
