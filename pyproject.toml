[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aginfer"
version = "0.1.0"
description = "Target-specific AOT AIM compiler and static runtime for edge VLA/VLM models"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []

[project.optional-dependencies]
yaml = ["PyYAML>=6"]
hub = ["huggingface-hub>=0.24"]
dev = ["pytest>=8"]

[project.scripts]
modelc = "aginfer.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
